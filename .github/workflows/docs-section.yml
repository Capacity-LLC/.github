# Required on every Capacity-LLC repository by the org ruleset "docs section required".
# Fails a pull request whose "## Documentation" section is missing, empty or a bare "None".
# Rule: CONTRIBUTING.md in this repository. Bots (release bot, Dependabot) are skipped, and a
# docs-exempt label ("no docs needed") counts when a code owner of the repository adds it, but not on
# their own PR (rbhocap may). Organisation admins can merge past a failure (ruleset bypass).
name: docs section

# As a ruleset-required workflow it runs only on opened, synchronize and reopened, whatever the types
# list says; edits and labels need a re-run. The checker reads the PR's current body and labels from
# the API, so a re-run (which replays the original event) still sees the latest description.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read        # the repository's CODEOWNERS (who may add docs-exempt)
  issues: read          # who added the docs-exempt label
  pull-requests: read

jobs:
  docs-section:
    name: docs section
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Runs in the calling repository, so fetch the checker from this one (public, no token).
      - uses: actions/checkout@v4
        with:
          repository: Capacity-LLC/.github
          ref: main
          path: .org-github
          persist-credentials: false

      - name: Check the Documentation section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .org-github/scripts/check_docs_section.py
